[project]
name = "alphafold2"
version = "0.1.0"
description = "AlphaFold2 - Educational"
authors = [
    { name = "Sam Barnett", email = "sfhbarnett91@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.88",
    "einops>=0.8.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
